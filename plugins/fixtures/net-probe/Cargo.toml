[package]
name = "net-probe"
version = "0.1.0"
description = "Test fixture: a contract 1.1.0 widget that makes the connector calls its configuration lists"
edition.workspace = true
publish.workspace = true

# Built bare: each test packs it with the manifest its case needs
[package.metadata.dashboard]
manifest = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json.workspace = true
# body_sha256, so a case that receives megabytes stays within the update's output limit
sha2 = { version = "0.10", default-features = false }
wit-bindgen.workspace = true
