[package]
name = "github-releases"
version = "0.1.0"
description = "Example plugin for contract 1.1.0: the latest releases of a GitHub repository, through catalog/github"
edition.workspace = true
publish.workspace = true

# Packed without a manifest until the runtime's manifest parser learns `connectors`
# (specs/003-plugin-connectors/tasks.md, T017)
[package.metadata.dashboard]
manifest = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json.workspace = true
wit-bindgen.workspace = true
