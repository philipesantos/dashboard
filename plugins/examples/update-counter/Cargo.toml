[package]
name = "update-counter"
version = "0.1.0"
description = "Example plugin for contract 1.2.0: counts its updates and keeps the last notes, in its own storage"
edition.workspace = true
publish.workspace = true

# The runtime learns quota_bytes in the next task, which adds the manifest
[package.metadata.dashboard]
manifest = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json.workspace = true
wit-bindgen.workspace = true
