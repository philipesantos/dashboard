[package]
name = "private-notes"
version = "0.1.0"
description = "Example plugin for contract 1.3.0: notes read as the user's account, through a development connector"
edition.workspace = true
publish.workspace = true

# The manifest declares account use, which the runtime's parser learns in the same feature; it is
# added once the parser reads it
[package.metadata.dashboard]
manifest = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json.workspace = true
wit-bindgen.workspace = true
