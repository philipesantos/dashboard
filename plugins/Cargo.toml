# Guest crates: example and hostile plugins, built into WebAssembly components by
# `cargo xtask plugins`. This is its own workspace, so `cargo clippy --workspace` at the root
# never builds them for the host.
[workspace]
resolver = "3"
# Listed one by one: a glob such as "examples/*" would also match examples/README.md.
members = [
    "examples/hello-widget",
    "hostile/infinite-loop",
    "hostile/huge-alloc",
    "hostile/deep-recursion",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
