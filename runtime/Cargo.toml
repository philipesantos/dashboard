[package]
name = "runtime"
version = "0.1.0"
description = "Plugin runtime: embeds Wasmtime and loads plugin components"
edition = "2024"
publish = false

[dependencies]
# Default location of the development grant record: the system's data directory
dirs = "7"
# Plugin versions in manifests follow SemVer 2.0.0
semver = "1"
# Typed manifest and grant record
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Names the field path of every manifest error, such as permissions[0].name
serde_path_to_error = "0.1"
# The package digest: SHA-256 of the whole file
sha2 = "0.10"
# Writes the grant record beside itself, then renames it over the old one
tempfile = "3"
# Parameter patterns of connectors: linear-time matching, so no value can stall a call
# (specs/003-plugin-connectors/research.md, R3)
regex = "1"
# TLS for connector requests, with the ring provider only, so aws-lc-rs never enters the build
# (R5, R18)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The HTTP client of the network module, its only user (R5). Pinned exactly: the resolver API
# the host relies on is in its `unversioned` module, which may change in a minor release.
# Mozilla's roots, rustls' own verifier, and no proxy, cookies or compression compiled in (R8, R9)
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
# Connector origins and redirect targets (R6, R7)
url = "2"
# Plugin storage: one SQLite database per plugin, used only in src/storage/
# (specs/004-plugin-storage/research.md, R1). Pinned exactly, since a minor release may change
# the authorizer's actions; the SQLite it compiles in is the one below. `hooks` gives the
# authorizer and `limits` the connection limits (R4); the default statement `cache` is left out.
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "hooks", "limits"] }
# Pins the SQLite that rusqlite's `bundled` compiles, 3.54.0: rusqlite asks for it only with a
# caret requirement, so without this a Cargo.lock update alone could change it (R1)
libsqlite3-sys = { version = "=0.39.0", default-features = false }
# Finds the manifest section without compiling the package. Pinned to the version Wasmtime 50
# uses, so the build carries one copy.
wasmparser = "=0.261.0"
# Only what the runtime needs: the Cranelift compiler, the Component Model and parallel
# compilation, which loads a plugin about 5 times faster (hello-widget: ~100 ms → ~20 ms).
# Default features such as GC, threads, async and stack switching are left out of the build.
wasmtime = { version = "50", default-features = false, features = [
    "component-model",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
] }

[features]
# The test seam of research R15: test routes and roots instead of DNS and Mozilla's roots.
# Only the runtime's own tests turn it on, through the dev-dependency below, and the library
# refuses to compile with it outside debug builds.
test-network = []

[dev-dependencies]
# Test certificates for the HTTPS test servers (tests/common/servers.rs); its default features
# use ring, as rustls does here
rcgen = "0.14"
# The runtime's tests reach the test seam (R15); release builds never do
runtime = { path = ".", features = ["test-network"] }
# Validates manifests against wit/manifest.schema.json, to prove the schema and the parser
# agree (tests/manifest_schema.rs)
boon = "0.6"
# Turns WebAssembly text into the binary packages that tests pass to Runtime::load
wat = "1"
# Reads wit/v1 to check that every capability can answer not-granted (tests/contract_v1.rs).
# Pinned to the version Wasmtime 50 uses.
wit-parser = "=0.261.0"
# The same features as above plus `wat`, for components written as text in tests and
# examples. Cargo merges dev-dependency features into test builds, so anything added here
# would also change the Wasmtime that the tests exercise.
wasmtime = { version = "50", default-features = false, features = [
    "component-model",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
    "wat",
] }
