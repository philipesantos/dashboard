[package]
name = "runtime"
version = "0.1.0"
description = "Plugin runtime: embeds Wasmtime and loads plugin components"
edition = "2024"
publish = false
# `cargo run -p runtime` runs the development CLI, not its twin on the test seam
default-run = "runtime"
# The integration tests build as one executable, tests/it.rs, instead of one per file
autotests = false

[dependencies]
# The compile process builds the thread pool Cranelift compiles on, with its own size, before it
# confines itself; already in the lock through Wasmtime's parallel compilation
rayon = "1"
# Default location of the development grant record: the system's data directory
dirs = "7"
# Plugin versions in manifests follow SemVer 2.0.0
semver = "1"
# Typed manifest and grant record
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The CLI checks content as the app does (feature 009); only with the `cli` feature
widget-content = { path = "../widget-content", optional = true }
# The manifest's icon (feature 009, research R6): standard base64 of a PNG, decoded by the host so
# the frame draws pixels. Both already in the lock, through Tauri and others.
base64 = "0.22.1"
png = "0.18.1"
# Names the field path of every manifest error, such as permissions[0].name
serde_path_to_error = "0.1"
# The package digest: SHA-256 of the whole file
sha2 = "0.10"
# Writes the grant record beside itself, then renames it over the old one
tempfile = "3"
# Parameter patterns of connectors: linear-time matching, so no value can stall a call
# (specs/003-plugin-connectors/research.md, R3)
regex = "1"
# TLS for connector requests, with the ring provider only, so aws-lc-rs never enters the build
# (R5, R18)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The HTTP client of the network module, its only user (R5). Pinned exactly: the resolver API
# the host relies on is in its `unversioned` module, which may change in a minor release.
# Mozilla's roots, rustls' own verifier, and no proxy, cookies or compression compiled in (R8, R9)
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
# Connector origins and redirect targets (R6, R7)
url = "2"
# Plugin storage: one SQLite database per plugin, used only in src/storage/
# (specs/004-plugin-storage/research.md, R1). Pinned exactly, since a minor release may change
# the authorizer's actions; the SQLite it compiles in is the one below. `hooks` gives the
# authorizer and `limits` the connection limits (R4); the default statement `cache` is left out.
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "hooks", "limits"] }
# Pins the SQLite that rusqlite's `bundled` compiles, 3.54.0: rusqlite asks for it only with a
# caret requirement, so without this a Cargo.lock update alone could change it (R1)
libsqlite3-sys = { version = "=0.39.0", default-features = false }
# The secrets vault (specs/005-plugin-credentials/research.md, R5): keyring-rs's API, used only in
# src/vault/store.rs, with one store per system below. Pinned exactly, as security core.
keyring-core = "=1.0.1"
# Credentials held in memory are wiped when dropped (R5)
zeroize = "1"
# Random vault and account ids, PKCE verifiers and sign-in states (R2, R5): the system's random
# source, from the ring the TLS stack already builds
ring = { version = "0.17", default-features = false }
# The echo check: a response must not carry the credential its request sent (R10)
memchr = "2"
# Parses the browser's request to the sign-in callback on the loopback address (R2)
httparse = "1"
# Only the development CLI uses these two (R14): a key read from the terminal without echo, and the
# system browser opened at the sign-in address; on Windows through ShellExecute, never a shell
rpassword = "7"
open = { version = "5", features = ["shellexecute-on-windows"] }
# Finds the manifest section without compiling the package. Pinned to the version Wasmtime 50
# uses, so the build carries one copy.
wasmparser = "=0.261.0"
# Turns the core module cargo builds into a component in `runtime pack`: the release xtask uses
# and wit-bindgen 0.63.0 encodes the component type with (specs/006-contract-v1-docs, R2)
wit-component = "=0.262.0"
# Only what the runtime needs: the Cranelift compiler, the Component Model and parallel
# compilation, which loads a plugin about 5 times faster (hello-widget: ~100 ms → ~20 ms).
# Default features such as GC, threads, async and stack switching are left out of the build.
wasmtime = { version = "50", default-features = false, features = [
    "component-model",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
] }

# The keychain of each system (R5). Linux: the Secret Service through the system's libdbus,
# synchronous; never the `vendored` feature, whose libdbus C sources are AFL-2.1 or GPL-2.0
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }
# The compile process's confinement (specs/010-plugin-installation/research.md, R13): a seccomp
# filter that allows only the calls compiling needs, and a Landlock ruleset that grants no file
# access
seccompiler = "0.5"
landlock = "0.4"

# The development CLI. Its code sits behind the `cli` feature, so a host that links the library,
# such as the app, does not get the development record and paths it uses
# (specs/009-declarative-widget-ui/research.md, R3)
[[bin]]
name = "runtime"
required-features = ["cli"]

# The development CLI on the test seam, for the docs runner (specs/006-contract-v1-docs/research.md,
# R9): it builds only with test-network, which refuses release builds, so `cargo install` never
# installs it
[[bin]]
name = "runtime-test-network"
required-features = ["test-network", "cli"]

# Every file in tests/ is a module of this one executable: each executable links the whole runtime
# (about 100 MB in debug), so one per file filled the disk. tests/it.rs fails when a file there
# is not listed.
[[test]]
name = "it"
path = "tests/it.rs"

[features]
default = ["cli"]
# The development command-line tool (`runtime::cli`), on by default for the `runtime` binary and
# the tests; the app turns default features off
cli = ["dep:widget-content"]
# The test seam of research R15: test routes and roots instead of DNS and Mozilla's roots.
# Only the runtime's own tests turn it on, through the dev-dependency below, and the library
# refuses to compile with it outside debug builds.
test-network = []

[dev-dependencies]
# Test certificates for the HTTPS test servers (tests/common/servers.rs); its default features
# use ring, as rustls does here
rcgen = "0.14"
# The runtime's tests reach the test seam (R15); release builds never do
runtime = { path = ".", features = ["test-network", "cli"] }
# Validates manifests against wit/manifest.schema.json, to prove the schema and the parser
# agree (tests/manifest_schema.rs)
boon = "0.6"
# Turns WebAssembly text into the binary packages that tests pass to Runtime::load
wat = "1"

# Reads wit/v1 to check that every capability can answer not-granted (tests/contract_v1.rs).
# Pinned to the version Wasmtime 50 uses.
wit-parser = "=0.261.0"
# The same features as above plus `wat`, for components written as text in tests and
# examples. Cargo merges dev-dependency features into test builds, so anything added here
# would also change the Wasmtime that the tests exercise.
wasmtime = { version = "50", default-features = false, features = [
    "component-model",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
    "wat",
] }

# Only the development CLI: the terminal's echo turned off before the key prompt is shown, which
# rpassword does only once it starts reading (R14); already in the lock file through Wasmtime
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A pseudo-terminal for the CLI's key prompt, which reads /dev/tty (tests/cli.rs)
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
