[package]
name = "xtask"
version = "0.1.0"
description = "Repository tasks: `cargo xtask plugins` builds the plugin components; `cargo xtask clean-space` frees build disk"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"
# Appends each plugin's manifest to its component as a custom section
wasm-encoder = "0.262"
wit-component = "0.262"
