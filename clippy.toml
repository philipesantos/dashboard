    { path = "std::net::TcpStream", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "std::net::UdpSocket", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "rusqlite::Connection", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "std::net::TcpListener", reason = "only runtime/src/network/ opens sockets (Principle III, research R19)" },
    { path = "keyring_core::Entry", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)" },
    { path = "keyring_core::api::CredentialStoreApi", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)" },
    { path = "keyring_core::api::CredentialApi", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)" },
    { path = "keyring_core::mock::Store", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)" },
    { path = "dbus_secret_service_keyring_store::Store", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)", allow-invalid = true },
    { path = "windows_native_keyring_store::Store", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)", allow-invalid = true },
    { path = "apple_native_keyring_store::keychain::Store", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)", allow-invalid = true },
