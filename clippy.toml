# Only runtime/src/network/ opens connections, and it is the only user of ureq: the review of
# that module then covers every byte a connector sends (constitution Principle III,
# specs/003-plugin-connectors/research.md, R20). The network module and the test servers
# allow these with an inner #![allow(clippy::disallowed_types, clippy::disallowed_methods)].
#
# Likewise only runtime/src/storage/ opens a plugin's store, and it is the only user of rusqlite:
# the review of that module then covers every SQL statement the host runs and every hardening
# layer (Principle IX, specs/004-plugin-storage/research.md, R15). It allows them the same way.
#
# Only runtime/src/vault/ touches the keychain, through keyring-core and one store per system: the
# review of that module covers every credential the host reads or writes
# (specs/005-plugin-credentials/research.md, R19). The sign-in's loopback listener is the only
# socket a peer connects to, in runtime/src/network/ with the rest of the network code. The
# store types of other systems do not resolve on every system, hence `allow-invalid`.

disallowed-types = [
    { path = "ureq::Agent", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::config::Config", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::RequestBuilder", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    # with_default_agent builds an agent that reads the proxy variables
    { path = "ureq::RequestExt", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "std::net::TcpStream", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "std::net::UdpSocket", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "rusqlite::Connection", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "std::net::TcpListener", reason = "only runtime/src/network/ opens sockets (Principle III, research R19)" },
    { path = "keyring_core::Entry", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)" },
    { path = "keyring_core::api::CredentialStoreApi", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)" },
    { path = "keyring_core::api::CredentialApi", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)" },
    { path = "keyring_core::mock::Store", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)" },
    { path = "dbus_secret_service_keyring_store::Store", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)", allow-invalid = true },
    { path = "windows_native_keyring_store::Store", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)", allow-invalid = true },
    { path = "apple_native_keyring_store::keychain::Store", reason = "only runtime/src/vault/ touches the keychain (Principle IX, research R19)", allow-invalid = true },
]

disallowed-methods = [
    # Every free function of ureq 3.5.0; run sends with a default agent that reads the proxy
    # variables
    { path = "ureq::run", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::agent", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::get", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::post", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::put", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::patch", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::delete", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::head", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::options", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::connect", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "ureq::trace", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "std::net::TcpStream::connect", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "std::net::TcpStream::connect_timeout", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "std::net::UdpSocket::bind", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
    { path = "std::net::TcpListener::bind", reason = "only runtime/src/network/ opens sockets (Principle III, research R19)" },
    { path = "keyring_core::set_default_store", reason = "the vault injects its store and never uses the global default (research R5)" },
    { path = "keyring_core::get_default_store", reason = "the vault injects its store and never uses the global default (research R5)" },
    # Every constructor of rusqlite 0.41.0's Connection
    { path = "rusqlite::Connection::open", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "rusqlite::Connection::open_with_flags", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "rusqlite::Connection::open_with_flags_and_vfs", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "rusqlite::Connection::open_in_memory", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "rusqlite::Connection::open_in_memory_with_flags", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "rusqlite::Connection::open_in_memory_with_flags_and_vfs", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "rusqlite::Connection::from_handle", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
    { path = "rusqlite::Connection::from_handle_owned", reason = "only runtime/src/storage/ opens a store (Principle IX, research R15)" },
]
