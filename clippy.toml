# Only runtime/src/network/ opens connections, and it is the only user of ureq: the review of
# that module then covers every byte a connector sends (constitution Principle III,
# specs/003-plugin-connectors/research.md, R20). The network module and the test servers
# allow these with an inner #![allow(clippy::disallowed_types, clippy::disallowed_methods)].
#
# Likewise only runtime/src/storage/ opens a plugin's store, and it is the only user of rusqlite:
# the review of that module then covers every SQL statement the host runs and every hardening
# layer (Principle IX, specs/004-plugin-storage/research.md, R15). It allows them the same way.
#
# Only runtime/src/vault/ touches the keychain, through keyring-core and one store per system: the
# review of that module covers every credential the host reads or writes
# (specs/005-plugin-credentials/research.md, R19). The sign-in's loopback listener is the only
# socket a peer connects to, in runtime/src/network/ with the rest of the network code. The
# store types of other systems do not resolve on every system, hence `allow-invalid`.
#
# The host window (host/) never shows a native prompt or dialog: trust decisions are asked only
# in host dialogs (constitution, Principle VII; docs/design/host-surfaces.md, HS-12). No plugin
# string reaches GPUI's image loader, its SVG file reader, its asset loader or its URL opener, and
# GPUI never touches the keychain (specs/008-host-window-dialogs, research R9 and R12). Only
# host/src/media.rs may call img and svg, with bytes the host holds; it allows them with an inner
# #![allow(clippy::disallowed_methods)], which host/tests/checks.rs refuses anywhere else.

disallowed-types = [
    { path = "ureq::Agent", reason = "only runtime/src/network/ opens connections (Principle III, research R20)" },
