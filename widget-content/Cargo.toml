[package]
name = "widget-content"
version = "0.1.0"
description = "Reads the content a widget's render returns: the declarative UI's format, checked and normalised for the host"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Validates content against wit/content.schema.json, to prove the schema and the reader agree
boon = "0.6"
