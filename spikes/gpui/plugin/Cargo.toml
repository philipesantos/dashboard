# The spike's own plugin, in a workspace of its own, since it builds for wasm32-unknown-unknown
# (as plugins/ does). `cargo run -p pack` in spikes/gpui builds and packs it.
[workspace]
resolver = "3"
members = ["ui-sampler"]

[workspace.package]
edition = "2024"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
