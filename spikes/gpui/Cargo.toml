# Spike: GPUI as the host UI (spikes/gpui/README.md). Its own workspace, so nothing here changes
# the root workspace, its lock file or its profiles.
[workspace]
resolver = "3"
members = ["host", "widget-kit", "pack"]

[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
# Every version is pinned with `=`: moving GPUI is a deliberate decision (REPORT.md).
gpui-kit = { version = "=0.9.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# GPUI's own advice (gpui-kit's workspace): optimize the hot rendering crates in debug builds.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
