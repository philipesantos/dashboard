name: Bench

# Measures the plugin runtime on all three systems, with the release profile (User Story 4).
# Run by hand: shared CI runners are too noisy for benchmarks to gate every change, and the
# release build with LTO would add minutes to every CI run. The results go to the summary of
# each job; specs/001-plugin-runtime/performance.md records the load and render times,
# specs/002-plugin-permissions/performance.md the permission checks (checks_us, relink_us), and
# specs/003-plugin-connectors/performance.md the connector checks and the render of a connected
# widget from kept data (render_with_data_us), specs/004-plugin-storage/performance.md what
# storage costs and the files stores take (storage_cost), and
# specs/005-plugin-credentials/performance.md what a credential adds to a request and the
# keychain's reads (credential_cost). Nothing reaches the network.
#
# Two ways to run it: from the Actions tab once the workflow is on master, or by adding the
# "bench" label to a pull request, which also works before the workflow reaches master.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      iterations:
        description: Render calls to measure
        default: "1000"

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA; the comment holds the matching tag.
jobs:
  bench:
    name: Bench (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bench'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # The pull request's own commit, not the merge commit GitHub builds for it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The runtime's Secret Service store links libdbus; the vault bench reads the real
      # keychain, so GNOME Keyring runs it on Linux (specs/005-plugin-credentials/research.md, R15)
      - name: Install the vault's system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt_options update
          sudo apt-get $apt_options install -y libdbus-1-dev pkg-config gnome-keyring

      - run: cargo xtask plugins --locked

      # A plugin runs only once approved; the approval goes to a record of this job alone
      - name: Load and render hello-widget
        env:
          ITERATIONS: ${{ inputs.iterations || '1000' }}
          GRANTS: ${{ runner.temp }}/bench-grants.json
          DATA: ${{ runner.temp }}/bench-data
        run: |
          cargo run -p runtime --release --locked -- \
            approve target/plugins/hello-widget.wasm --grants "$GRANTS" --data "$DATA"
          cargo run -p runtime --release --locked -- \
            bench target/plugins/hello-widget.wasm --iterations "$ITERATIONS" --grants "$GRANTS" --data "$DATA" \
            | tee bench.txt

      # A connected widget: approved with the digest permissions prints, then rendered from kept
      # data held in memory, so no update runs and nothing reaches the network
      - name: Load and render github-releases from kept data
        env:
          ITERATIONS: ${{ inputs.iterations || '1000' }}
          GRANTS: ${{ runner.temp }}/bench-grants.json
          DATA: ${{ runner.temp }}/bench-data
          CONFIG: '{"owner":"rust-lang","repo":"rust"}'
        run: |
          plugin=target/plugins/github-releases.wasm
          digest=$(cargo run -q -p runtime --release --locked -- \
            permissions "$plugin" --grants "$GRANTS" --data "$DATA" | sed -n 's/^approval digest: //p')
          cargo run -p runtime --release --locked -- \
            approve "$plugin" --expect "$digest" --grants "$GRANTS" --data "$DATA"
          cargo run -p runtime --release --locked -- \
            bench "$plugin" --iterations "$ITERATIONS" --config "$CONFIG" \
            --kept-data plugins/examples/github-releases/bench-data.json --grants "$GRANTS" --data "$DATA" \
            | tee connected.txt

      # Storage calls, an update with storage and stores filled to the host cap, on this
      # system's disk (specs/004-plugin-storage/research.md, R16)
      - name: Storage costs
        run: cargo run -p dashboard-bench --release --locked --bin storage_cost | tee storage.txt

      # What a credential adds to a request, and reads of the system's keychain; on Linux in a
      # session bus of its own with GNOME Keyring unlocked, as CI's tests run
      # (specs/005-plugin-credentials/research.md, R18)
      - name: Credential costs
        run: |
          bench='cargo run -p dashboard-bench --release --locked --bin credential_cost'
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -c "gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'bench' && $bench" | tee credential.txt
          else
            $bench | tee credential.txt
          fi

      # Compiling runs outside every per-call limit (docs/threat-model.md)
      - name: Load packages near the size cap
        run: |
          for shape in many huge; do
            cargo run -p dashboard-bench --release --locked --bin compile_cost -- "$shape" | tee -a compile.txt
          done

      - name: Summary
        env:
          OS: ${{ matrix.os }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          {
            echo "### $OS at ${COMMIT::7}, $cores cores"
            echo '```text'
            echo 'hello-widget:'
            cat bench.txt
            echo 'github-releases, rendered from kept data:'
            cat connected.txt compile.txt
            echo 'storage (store-probe):'
            cat storage.txt
            echo 'credentials:'
            cat credential.txt
            echo '```'
            echo 'Recorded in specs/001-plugin-runtime/performance.md (load, render, compile),'
            echo 'specs/002-plugin-permissions/performance.md (checks_us, relink_us),'
            echo 'specs/003-plugin-connectors/performance.md (checks_us and render_with_data_us of'
            echo 'github-releases), specs/004-plugin-storage/performance.md (storage_cost) and'
            echo 'specs/005-plugin-credentials/performance.md (credential_cost).'
          } >> "$GITHUB_STEP_SUMMARY"
