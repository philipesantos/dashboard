name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit SHA; the comment holds the matching tag.
# Every job has a timeout well above its usual time, so a stalled network call fails the job
# instead of holding it for GitHub's default of 6 hours.
jobs:
  # Changes that only touch documentation or specs build and test nothing, so the jobs below
  # skip them. The workflow still runs, because a skipped job counts as passing for the
  # required "CI result" check, while a workflow that never starts leaves it pending forever.
  # New advisories do not need a change here; audit.yml checks for them every week.
  # The constitution (v5.0.0, Development Workflow) allows this skip; keep the documentation
  # paths below in sync with the ones it lists. Markdown the build uses as code is not
  # documentation for that rule: the docs checks read docs/authors/ and wit/, and the design
  # checks read DESIGN.md, design/, docs/design/ and docs/threat-model.md, so a change there runs
  # everything (specs/006-contract-v1-docs/research.md, R11; specs/007-host-visual-design/
  # research.md, R12).
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE_SHA...$HEAD_SHA" ;;
            push) git cat-file -e "$BEFORE^{commit}" 2>/dev/null && range="$BEFORE..$GITHUB_SHA" || range="" ;;
            *) range="" ;;
          esac
          if [ -z "$range" ]; then
            echo "Nothing to compare against; running every job."
            code=true
          else
            changed=$(git diff --name-only --no-renames "$range")
            printf '%s\n' "$changed"
            # Documentation only: Markdown anywhere, specs/, docs/, .specify/ and LICENSE, except
            # what the docs and design checks read
            if grep -qE '^(docs/authors|docs/design|wit|design)/|^DESIGN\.md$|^docs/threat-model\.md$' <<< "$changed"; then
              code=true
            elif grep -qvE '\.md$|^(specs|docs|\.specify)/|^LICENSE$' <<< "$changed"; then
              code=true
            else
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Ubuntu mirror sometimes stalls a download for good. apt retries slow requests on
      # its own, and the step fails after 5 minutes instead of hanging the job (it takes under
      # a minute when the mirror responds).
      - name: Install system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt_options update
          # The secrets vault: libdbus to build the Secret Service store, gnome-keyring for
          # the tests that use the real keychain (specs/005-plugin-credentials/research.md, R15)
          sudo apt-get $apt_options install -y libdbus-1-dev gnome-keyring
          # The host window links GPUI's X11 and Wayland libraries (specs/008-host-window-dialogs)
          sudo apt-get $apt_options install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libx11-xcb-dev libfreetype-dev libfontconfig-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          # Plugins build for WebAssembly; wasip2 only for the hostile fixtures that import WASI
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Builds every plugin into target/plugins/, the fixtures the runtime tests load
      - run: cargo xtask plugins --locked

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The plugins/ workspace, in the target dir the xtask uses, so the cache covers it
      - run: cargo clippy --manifest-path plugins/Cargo.toml --target wasm32-unknown-unknown --target-dir target/plugins-build --locked -- -D warnings

      - run: cargo test --workspace --locked
        if: runner.os != 'Linux'

      # On Linux the vault tests need a session bus with an unlocked Secret Service: a login
      # keyring created with a throwaway password (the here-string's newline is required)
      - name: cargo test --workspace --locked (in a session with GNOME Keyring)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c "gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'ci' && cargo test --workspace --locked"

      # DESIGN.md checked against the format and the contrast rules, and the generated files
      # compared with what it produces (specs/007-host-visual-design, FR-004, FR-005)
      - run: cargo xtask design --check
        if: runner.os == 'Linux'

      # The SVG preview of the visual system, for a reviewer to open in a browser (FR-026)
      - run: cargo xtask design --preview target/design-preview
        if: runner.os == 'Linux'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: design-preview
          path: target/design-preview/
          retention-days: 14
          if-no-files-found: error

      # The connectors' test seam replaces DNS and the trusted roots; the runtime refuses to
      # compile with it outside debug builds, so no build anyone runs can include it
      # (specs/003-plugin-connectors/research.md, R15). This fails unless that refusal happens.
      - name: The test seam never builds in release
        shell: bash
        run: |
          if cargo check -p runtime --release --features test-network --locked 2> seam.txt; then
            echo "the runtime built in release with the test-network feature" >&2
            exit 1
          fi
          grep -q "the test-network feature is only for the runtime's own tests" seam.txt || {
            cat seam.txt >&2
            echo "the release build failed, but not because of the test seam" >&2
            exit 1
          }

  # The docs for authors, run as written on each system: the walkthrough from a clone of this
  # checkout to a running widget, the guides against the test services, and the reference's
  # examples; and the drift test between the reference and the sources. On machines of their
  # own, so the timed hostile cases of the build job keep theirs
  # (specs/006-contract-v1-docs/research.md, R8 and R11).
  docs:
    name: Docs for authors (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The walkthrough clones this checkout
          fetch-depth: 0
          persist-credentials: false

      # What the walkthrough tells authors to install on Linux, and the Secret Service the
      # accounts guide signs in to
      - name: Install the runtime's system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt_options update
          sudo apt-get $apt_options install -y libdbus-1-dev pkg-config gnome-keyring

      # The version the walkthrough was walked with (research R4); moving it is a reviewed
      # change to the walkthrough and this job together
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The guides start from the examples
      - run: cargo xtask plugins --locked

      - run: 'cargo test -p runtime --test it --locked docs_reference::'

      - name: The docs run as written
        if: runner.os != 'Linux'
        env:
          DASHBOARD_DOCS_TARGET_DIR: ${{ github.workspace }}/target
        run: 'cargo test -p runtime --test it --locked -- --ignored docs_walk::'

      - name: The docs run as written (in a session with GNOME Keyring)
        if: runner.os == 'Linux'
        env:
          DASHBOARD_DOCS_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          dbus-run-session -- bash -c "gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'ci' && cargo test -p runtime --test it --locked -- --ignored docs_walk::"

  audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit

      - run: cargo audit

      - run: cargo audit --file plugins/Cargo.lock

      # What the authors' walkthrough builds (specs/006-contract-v1-docs/research.md, R8)
      - run: cargo audit --file docs/authors/getting-started/Cargo.lock

  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny

      - run: cargo deny check

      - run: cargo deny --manifest-path plugins/Cargo.toml check

      - run: cargo deny --manifest-path docs/authors/getting-started/Cargo.toml check

      # A crate that depends on host-surfaces must fail the bans, which shows the ban bites
      # before any kit crate exists (specs/007-host-visual-design/research.md, R6). The root
      # deny.toml applies, since cargo-deny reads <cwd>/deny.toml.
      - name: The host-surfaces ban refuses a crate that is not the host
        run: |
          if cargo deny --manifest-path design/ban-fixture/Cargo.toml check bans 2> bans.txt; then
            echo "design/ban-fixture passed the bans, but it depends on host-surfaces" >&2
            exit 1
          fi
          grep -q "crate 'host-surfaces = 0.1.0' is explicitly banned" bans.txt || {
            cat bans.txt >&2
            echo "the ban fixture failed, but not because of the host-surfaces ban" >&2
            exit 1
          }

  # The host in a real window: real input from the operating system and the accessibility tree
  # read through the platform, then the pixels GPUI's headless renderer draws
  # (specs/008-host-window-dialogs, research R13). Its own job: GPUI's build and the window take
  # their own time.
  host-window:
    name: Host window (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt_options update
          # GPUI's libraries, Mesa's software Vulkan and GL, a virtual display, the AT-SPI bus,
          # xdotool for real input and Python's AT-SPI bindings to read the tree
          sudo apt-get $apt_options install -y libdbus-1-dev pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfreetype-dev \
            libfontconfig-dev libwayland-dev libvulkan1 mesa-vulkan-drivers libegl1 \
            libgl1-mesa-dri xvfb at-spi2-core xdotool python3-gi gir1.2-atspi-2.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          # The fixtures the window loads build for WebAssembly
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo xtask plugins --locked

      # The scrim and the focus ring, in pixels, on the GPU without a display (Windows has no
      # headless renderer and skips; the window below covers it)
      - run: cargo test -p host --test pixels --locked

      - name: Real window (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            set -e
            busctl --user call org.a11y.Bus /org/a11y/bus org.a11y.Bus GetAddress
            busctl --user set-property org.a11y.Bus /org/a11y/bus org.a11y.Status IsEnabled b true
            unset WAYLAND_DISPLAY
            Xvfb :99 -screen 0 2200x1000x24 &
            xvfb=$!
            sleep 2
            export DISPLAY=:99
            status=0
            cargo test -p host --test window --locked || status=$?
            kill $xvfb
            exit $status'

      - name: Real window (macOS, Windows)
        if: runner.os != 'Linux'
        run: cargo test -p host --test window --locked

      # Each GPUI method clippy.toml bans, called once in a crate outside the workspace; it passes
      # only when clippy refuses all 41 (contracts/bans-and-checks.md). The bans are the same on
      # every system, so Linux runs it.
      - name: Clippy refuses every banned GPUI method
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: target/ban-fixture
        run: |
          cp Cargo.lock host/ban-fixture/Cargo.lock
          if cargo clippy --color never --manifest-path host/ban-fixture/Cargo.toml -- -D warnings 2> bans.txt; then
            echo "host/ban-fixture passed clippy, but it calls every banned GPUI method" >&2
            exit 1
          fi
          refused=$(grep -c 'error: use of a disallowed method' bans.txt || true)
          others=$(grep -E '^(error|warning)' bans.txt | grep -v 'disallowed method' \
            | grep -vc '^error: could not compile' || true)
          if [ "$refused" != 41 ] || [ "$others" != 0 ]; then
            cat bans.txt >&2
            echo "expected 41 disallowed-method errors and nothing else; got $refused and $others" >&2
            exit 1
          fi

  # The only check the master ruleset requires, so jobs can be added or renamed without
  # touching the ruleset. It fails when any job failed or was cancelled.
  result:
    name: CI result
    needs: [changes, build, host-window, docs, audit, deny]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
