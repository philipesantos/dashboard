name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Rust the jobs build with, except the docs job, which walks the walkthrough with its own.
  # Pinned, because the Rust cache's key holds the compiler's version: on `stable`, every Rust
  # release emptied every cache at once, mid-pull-request. Moving it is a pull request of its own,
  # whose run on master saves the new caches.
  RUST_TOOLCHAIN: 1.100.0

# Third-party actions are pinned to a commit SHA; the comment holds the matching tag.
# Every job has a timeout well above its usual time, so a stalled network call fails the job
# instead of holding it for GitHub's default of 6 hours.
jobs:
  # Changes that only touch documentation or specs build and test nothing, so the jobs below
  # skip them. The workflow still runs, because a skipped job counts as passing for the
  # required "CI result" check, while a workflow that never starts leaves it pending forever.
  # New advisories do not need a change here; audit.yml checks for them every week.
  # The constitution (v2.6.3, Development Workflow) allows this skip; keep the documentation
  # paths below in sync with the ones it lists. Markdown the build uses as code is not
  # documentation for that rule: the docs checks read docs/authors/ and wit/, so a change there
  # runs everything (specs/006-contract-v1-docs/research.md, R11). The design checks read
  # DESIGN.md, design/ (whose test fixtures are Markdown), docs/design/ and
  # docs/threat-model.md, so those run everything too
  # (specs/007-host-visual-system/research.md, R9).
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE_SHA...$HEAD_SHA" ;;
            push) git cat-file -e "$BEFORE^{commit}" 2>/dev/null && range="$BEFORE..$GITHUB_SHA" || range="" ;;
            *) range="" ;;
          esac
          if [ -z "$range" ]; then
            echo "Nothing to compare against; running every job."
            code=true
          else
            changed=$(git diff --name-only --no-renames "$range")
            printf '%s\n' "$changed"
            # Documentation only: Markdown anywhere, specs/, docs/, .specify/ and LICENSE, except
            # what the docs and design checks read, and docs/webkitgtk-register.toml, which a test reads
            if grep -qE '^(design|docs/authors|docs/design|wit)/|^(DESIGN|docs/threat-model)\.md$|^docs/webkitgtk-register\.toml$' <<< "$changed"; then
              code=true
            elif grep -qvE '\.md$|^(specs|docs|\.specify)/|^LICENSE$' <<< "$changed"; then
              code=true
            else
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Three parts on each system, on machines of their own so they run side by side: the checks
  # (the design system, clippy, the test seam), the tests, and the shell probe. Each builds what
  # it needs and keeps its own Rust cache, since clippy's, the tests' and the probe's artifacts
  # are of three different kinds. Together they took 29 to 37 minutes on Windows in one job.
  build:
    name: ${{ matrix.part }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        part: [checks, tests, probe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Defender scanned every file the compiler wrote, which made Windows the slowest system.
      # The runner is a machine of its own for this job, discarded after it. (A Dev Drive mounted
      # at target/ did the same, but the Rust cache cannot read a volume mounted without a drive
      # letter, so Windows never restored its cache.)
      - name: Turn off Defender's real-time scan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled

      # The Ubuntu mirror sometimes stalls a download for good. apt retries slow requests on
      # its own, and the step fails after 5 minutes instead of hanging the job (it takes under
      # a minute when the mirror responds).
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt_options update
          # WEBKITGTK-ONLY(system-libs): Tauri 2 on Linux builds against WebKitGTK
          sudo apt-get $apt_options install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
          # A virtual display for the shell probe (specs/008-tauri-shell/research.md, R8)
          sudo apt-get $apt_options install -y xvfb
          # The secrets vault: libdbus to build the Secret Service store, gnome-keyring for
          # the tests that use the real keychain (specs/005-plugin-credentials/research.md, R15)
          sudo apt-get $apt_options install -y libdbus-1-dev gnome-keyring

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          # Plugins build for WebAssembly; wasip2 only for the hostile fixtures that import WASI
          targets: wasm32-unknown-unknown, wasm32-wasip2

      # Saved only from master, which every pull request reads: a pull request's own cache helps
      # only its next push. One cache per part (`key`), since the job's id is the same for all
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.part }}
          # TEMPORARY, ci-speed only: saved from this pull request too, to measure a warm run
          save-if: ${{ github.ref == 'refs/heads/master' || github.head_ref == 'ci-speed' }}

      - run: pnpm install --frozen-lockfile

      # DESIGN.md is the only source of the theme: the format's checker, contrast, color usage,
      # the host-only split, drift of the generated files and criteria coverage
      # (specs/007-host-visual-system/contracts/outputs.md)
      - run: pnpm --filter ./design check
        if: matrix.part == 'checks'

      - run: pnpm --filter ./design test
        if: matrix.part == 'checks'

      # Every installed npm package under an allowed license or a named exception
      # (specs/007-host-visual-system/research.md, R13). `run`, because `pnpm licenses` is a
      # built-in command.
      - run: pnpm --filter ./design run licenses
        if: matrix.part == 'checks'

      # A static page of the visual system, for review without building the app (research R8)
      - name: Design preview
        if: matrix.part == 'checks' && runner.os == 'Linux'
        run: pnpm --filter ./design preview

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.part == 'checks' && runner.os == 'Linux'
        with:
          name: design-preview
          path: design/preview/
          if-no-files-found: error

      # Builds every plugin into target/plugins/: the fixtures the runtime tests load, and the
      # bundled widgets the app embeds, so it runs before any build of the app
      # (specs/009-declarative-widget-ui/research.md, R1)
      - run: cargo xtask plugins --locked

      # Type-checks the UI and produces app/dist, which the Tauri crate embeds at compile time;
      # the probe's part builds the probe's page instead
      - run: pnpm --filter ./app build
        if: matrix.part != 'probe'

      # The checks

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.part == 'checks'

      # The plugins/ workspace, in the target dir the xtask uses, so the cache covers it
      - run: cargo clippy --manifest-path plugins/Cargo.toml --target wasm32-unknown-unknown --target-dir target/plugins-build --locked -- -D warnings
        if: matrix.part == 'checks'

      - run: cargo clippy -p dashboard --features shell-probe --all-targets --locked -- -D warnings
        if: matrix.part == 'checks'

      # The connectors' test seam replaces DNS and the trusted roots; the runtime refuses to
      # compile with it outside debug builds, so no build anyone runs can include it
      # (specs/003-plugin-connectors/research.md, R15). This fails unless that refusal happens.
      - name: The test seam never builds in release
        if: matrix.part == 'checks'
        shell: bash
        run: |
          if cargo check -p runtime --release --features test-network --locked 2> seam.txt; then
            echo "the runtime built in release with the test-network feature" >&2
            exit 1
          fi
          grep -q "the test-network feature is only for the runtime's own tests" seam.txt || {
            cat seam.txt >&2
            echo "the release build failed, but not because of the test seam" >&2
            exit 1
          }

      # The tests

      - run: cargo test --workspace --locked
        if: matrix.part == 'tests' && runner.os != 'Linux'

      # On Linux the vault tests need a session bus with an unlocked Secret Service: a login
      # keyring created with a throwaway password (the here-string's newline is required)
      - name: cargo test --workspace --locked (in a session with GNOME Keyring)
        if: matrix.part == 'tests' && runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c "gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'ci' && cargo test --workspace --locked"

      # A package just under the cap through the real compile process under the default limits,
      # on its own so the peak memory printed is the compile process's alone; research R2 records
      # the numbers per system (specs/010-plugin-installation/tasks.md, T042). Through the whole
      # workspace, as the tests above, so it reuses their build: `-p runtime` alone resolves other
      # features and built everything again, five to seven minutes on Windows
      - name: Compile cost under the default limits
        if: matrix.part == 'tests'
        run: cargo test --workspace --locked -- --ignored --exact compile::measure_compile_heavy_under_the_default_limits --nocapture

      # The shell probe: the release build plus one page module and three commands. Inside the
      # real page it tries every forbidden action, and it fails unless each one is refused
      # (specs/008-tauri-shell/contracts/probe.md). Built as `tauri build` builds, with
      # tauri/custom-protocol, so the page and its content policy are the release ones; in the
      # `probe` profile, the release one without LTO (Cargo.toml).

      - run: pnpm --filter ./app build --mode probe
        if: matrix.part == 'probe'

      - run: cargo build -p dashboard --profile probe --features shell-probe,tauri/custom-protocol --locked
        if: matrix.part == 'probe'

      - name: Shell probe
        if: matrix.part == 'probe'
        shell: bash
        timeout-minutes: 3
        env:
          DASHBOARD_PROBE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # WEBKITGTK-ONLY(ci-dmabuf): WebKitGTK's DMA-BUF renderer fails under xvfb
            WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a ./target/probe/dashboard
          else
            ./target/probe/dashboard
          fi

  # The docs for authors, run as written on each system: the walkthrough from a clone of this
  # checkout to a running widget, the guides against the test services, and the reference's
  # examples; and the drift test between the reference and the sources. On machines of their
  # own, so the timed hostile cases of the build job keep theirs
  # (specs/006-contract-v1-docs/research.md, R8 and R11).
  docs:
    name: Docs for authors (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The walkthrough clones this checkout
          fetch-depth: 0
          persist-credentials: false

      # What the walkthrough tells authors to install on Linux, and the Secret Service the
      # accounts guide signs in to
      - name: Install the runtime's system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt_options update
          sudo apt-get $apt_options install -y libdbus-1-dev pkg-config gnome-keyring

      # The version the walkthrough was walked with (research R4); moving it is a reviewed
      # change to the walkthrough and this job together
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown, wasm32-wasip2

      # Saved only from master, which every pull request reads: saving took up to 5 minutes on
      # Windows, and a pull request's own cache helps only its next push
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The guides start from the examples
      - run: cargo xtask plugins --locked

      - run: 'cargo test -p runtime --test it --locked docs_reference::'

      - name: The docs run as written
        if: runner.os != 'Linux'
        env:
          DASHBOARD_DOCS_TARGET_DIR: ${{ github.workspace }}/target
        run: 'cargo test -p runtime --test it --locked -- --ignored docs_walk::'

      - name: The docs run as written (in a session with GNOME Keyring)
        if: runner.os == 'Linux'
        env:
          DASHBOARD_DOCS_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          dbus-run-session -- bash -c "gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'ci' && cargo test -p runtime --test it --locked -- --ignored docs_walk::"

  audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit

      - run: cargo audit

      - run: cargo audit --file plugins/Cargo.lock

      # What the authors' walkthrough builds (specs/006-contract-v1-docs/research.md, R8)
      - run: cargo audit --file docs/authors/getting-started/Cargo.lock

  # npm's advisories, as cargo audit does for Rust. It fails at high and above; the moderate and
  # low advisories through the shadcn CLI are left, and one advisory for the copy of zod bundled
  # in the design.md checker is ignored in pnpm-workspace.yaml, with its reason
  # (specs/007-host-visual-system/research.md, R13).
  pnpm-audit:
    name: pnpm audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: pnpm audit --audit-level high

  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny

      - run: cargo deny check

      - run: cargo deny --manifest-path plugins/Cargo.toml check

      - run: cargo deny --manifest-path docs/authors/getting-started/Cargo.toml check

  # The only check the master ruleset requires, so jobs can be added or renamed without
  # touching the ruleset. It fails when any job failed or was cancelled.
  result:
    name: CI result
    needs: [changes, build, docs, audit, pnpm-audit, deny]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
