[workspace]
resolver = "3"
members = ["app/src-tauri", "bench", "runtime", "widget-content", "xtask"]
# Guest crates build for WebAssembly in their own workspace (cargo xtask plugins); the crate the
# authors' walkthrough builds is kept beside its page for cargo audit and cargo deny
exclude = ["plugins", "docs/authors/getting-started"]

# Profiles only take effect in the workspace root manifest.
# Debug builds (and tests, which inherit them) keep only line tables for workspace crates, enough
# for backtraces with file and line, and no debug info for dependencies: smaller and faster builds.
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimised even in these builds: Wasmtime and Cranelift compile every plugin a
# test or `tauri dev` loads, and unoptimised they made the runtime's tests 12 times slower (666 s
# against 56 s). The workspace's own crates stay unoptimised, with their debug assertions.
[profile.dev.package."*"]
debug = false
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The shell probe's build (specs/008-tauri-shell/contracts/probe.md): the release profile, so no
# debug assertions and the same code, but without link-time optimisation across crates, which
# changes how fast the code runs, not what the window allows, and took most of the probe's build
[profile.probe]
inherits = "release"
codegen-units = 16
lto = false
