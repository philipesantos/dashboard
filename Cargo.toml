[workspace]
resolver = "3"
members = ["app/src-tauri", "runtime", "xtask"]
# Guest crates build for WebAssembly in their own workspace (cargo xtask plugins)
exclude = ["plugins"]

# Profiles only take effect in the workspace root manifest.
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
