[package]
name = "dashboard"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The widget host (specs/009-declarative-widget-ui, research R1): the plugin runtime, without its
# development command-line tool, and the reader of the widget content format
runtime = { path = "../../runtime", default-features = false }
widget-content = { path = "../../widget-content" }

# WebView2 settings that wry does not expose: the probe reads them, and window.rs sets some
# (specs/008-tauri-shell/research.md, R6 and R7). The versions wry already locks.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

# The probe's engine reads on macOS and Linux (research R6 and R7), only in the probe build
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

# WEBKITGTK-ONLY(probe-devtools-read): the probe reads WebKitGTK's settings through it
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", optional = true }

[dev-dependencies]
# The surface test reads window-surface.toml and Cargo.toml (specs/008-tauri-shell, T011)
toml = "1.1.8"
# The widget host's tests (specs/009-declarative-widget-ui, T015): a fresh data directory each,
# and the runtime's mock vault, to hold a secret the form check must find. The test seam only
# compiles in debug builds, and dev-dependencies never reach a build of the app
tempfile = "3"
runtime = { path = "../../runtime", default-features = false, features = ["test-network"] }

[features]
# The shell probe: the release build plus a report command and an ungranted one, for the
# breaking tests of specs/008-tauri-shell/contracts/probe.md. Never shipped.
# WEBKITGTK-ONLY(probe-devtools-read): the Linux reads need webkit2gtk
shell-probe = ["dep:objc2-web-kit", "dep:webkit2gtk"]
