[package]
name = "design-gen"
version = "0.1.0"
description = "Checks DESIGN.md, generates the design tokens, the DTCG export and the preview, and runs the contrast lint"
edition = "2024"
publish = false
# The integration tests build as one executable, tests/it.rs, as the runtime's do
autotests = false

[dependencies]
# Reads DESIGN.md's front matter and its design-roles blocks; the maintained successor of
# yaml-rust, pure Rust (specs/007-host-visual-design/research.md, R4). Without its default
# "encoding" feature: DESIGN.md is UTF-8, and the feature pulls an old encoding_rs and cfg-if
yaml-rust2 = { version = "=0.13.0", default-features = false }

[dev-dependencies]
# SC-004 compares the appearance rule of design-tokens with an independent computation
design-tokens = { path = "../tokens" }
# The pins test hashes the vendored files under design/
sha2 = "0.10"

[[test]]
name = "it"
path = "tests/it.rs"
