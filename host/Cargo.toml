[package]
name = "host"
version = "0.1.0"
description = "The dashboard's host window: the chrome, widget frames, panels and host dialogs, drawn with GPUI"
edition = "2024"
publish = false

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
runtime = { path = "../runtime" }
design-tokens = { path = "../design/tokens" }
# Only this crate may depend on it (deny.toml, specs/007-host-visual-design/research.md, R6)
host-surfaces = { path = "../design/host-surfaces" }
serde_json = "1"
# A plugin's name made safe for the frame's label: grapheme clusters and general categories
# (docs/design/host-surfaces.md, HS-06, HS-07; research R8)
unicode-segmentation = "1"
unicode-properties = "0.1"

# GPUI from gpui-unofficial, the republish of Zed's GPUI at Zed's stable tags (constitution, Fixed
# Technical Decisions). Every crate of the line is a direct dependency pinned with `=` to the same
# stable version, recorded in README.md with the patch list it was reviewed against: the siblings
# depend on each other with caret requirements, so pinning only some lets the rest drift
# (specs/008-host-window-dialogs/research.md, R1).
gpui = { package = "gpui-unofficial", version = "=1.25.3" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.25.3" }
collections-gpui-unofficial = "=1.25.3"
derive-refineable-gpui-unofficial = "=1.25.3"
gpui-macros-gpui-unofficial = "=1.25.3"
gpui-shared-string-gpui-unofficial = "=1.25.3"
gpui-util-gpui-unofficial = "=1.25.3"
http-client-gpui-unofficial = "=1.25.3"
refineable-gpui-unofficial = "=1.25.3"
scheduler-gpui-unofficial = "=1.25.3"
sum-tree-gpui-unofficial = "=1.25.3"
ztracing-gpui-unofficial = "=1.25.3"
ztracing-macro-gpui-unofficial = "=1.25.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui-linux-gpui-unofficial = "=1.25.3"

[target.'cfg(target_os = "linux")'.dependencies]
gpui-wgpu-gpui-unofficial = "=1.25.3"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-macos-gpui-unofficial = "=1.25.3"
gpui-apple-gpui-unofficial = "=1.25.3"

[target.'cfg(target_os = "windows")'.dependencies]
gpui-windows-gpui-unofficial = "=1.25.3"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-web-gpui-unofficial = "=1.25.3"

[dev-dependencies]
gpui = { package = "gpui-unofficial", version = "=1.25.3", features = ["test-support"] }
# The headless renderer, for examples/screenshot.rs
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.25.3", features = ["test-support"] }
# Saves the screenshots of examples/screenshot.rs; GPUI already depends on it
image = { version = "0.25", default-features = false, features = ["png"] }
# Temporary records and data directories in tests
tempfile = "3"
anyhow = "1"
